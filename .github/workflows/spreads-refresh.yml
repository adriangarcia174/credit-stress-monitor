name: Daily spreads refresh

on:
  schedule:
    # Daily 14:00 UTC (09:00 CT): after FRED's morning data update
    - cron: '0 14 * * *'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch spreads from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_spreads.py

      - name: Commit updated data
        run: |
          git config user.name "spreads-bot"
          git config user.email "spreads-bot@users.noreply.github.com"
          git add spreads.json
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
          else
            git commit -m "Spreads refresh $(date -u +%F)"
            git push
          fi
